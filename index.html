<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13.08.2011</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@200;300&display=swap');

        :root {
            --bg-color: #030303;
            --text-primary: #f5f5f7;
            --text-gold: rgba(212, 175, 55, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        /* Extended scroll track to fit the new ending smoothly */
        .scroll-container {
            height: 800vh;
        }

        .viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.8;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 70%);
            z-index: 2;
            opacity: 0;
            transition: opacity 2s ease, transform 0.1s ease-out;
        }

        .stage {
            position: absolute;
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1), transform 2s cubic-bezier(0.25, 1, 0.5, 1), filter 1s ease;
            filter: blur(10px);
            will-change: opacity, transform, filter;
        }

        .stage.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0px);
        }

        .stage.passed {
            opacity: 0;
            transform: scale(1.05);
            filter: blur(10px);
        }

        .point-of-light {
            width: 2px;
            height: 2px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px 2px rgba(255, 255, 255, 0.8);
            transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        h1, h2, p {
            font-weight: normal;
            letter-spacing: 0.1em;
        }

        .date {
            font-size: 1.2rem;
            letter-spacing: 0.5em;
            color: rgba(255, 255, 255, 0.7);
        }

        .sequence-text {
            font-size: 1.5rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.8);
            line-height: 2.5;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sequence-line {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        .name-reveal {
            font-family: 'Cinzel', serif;
            font-size: clamp(3rem, 8vw, 8rem);
            letter-spacing: 0.3em;
            font-weight: 600;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .climax-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 6vw, 6rem);
            letter-spacing: 0.2em;
            color: #fff;
            text-shadow: 0 0 50px rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
        }

        .climax-subtitle {
            font-size: 0.8rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }

        .final-settle {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.5rem, 3vw, 3rem);
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.8);
        }

        /* New Signature Styles */
        .signature {
            font-size: 0.8rem;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
        }

        .audio-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 100;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            text-transform: uppercase;
            pointer-events: auto;
            transition: color 0.3s ease;
        }

        .audio-toggle:hover {
            color: #fff;
        }

        .scroll-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="scroll-container"></div>
    <button class="audio-toggle" id="audioBtn">Sound [Off]</button>
    <div class="scroll-indicator" id="scrollInd">Scroll slowly</div>
    <div class="ambient-glow" id="ambientGlow"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="viewport">
        <div class="stage" id="stage1">
            <div class="point-of-light" id="pointLight"></div>
        </div>
        <div class="stage" id="stage2">
            <p class="date">13.08.2011</p>
        </div>
        <div class="stage" id="stage3">
            <div class="sequence-text">
                <p class="sequence-line" id="line1">One day.</p>
                <p class="sequence-line" id="line2">One person.</p>
                <p class="sequence-line" id="line3">One reason to celebrate.</p>
            </div>
        </div>
        <div class="stage" id="stage4">
            <h1 class="name-reveal">DAKSHA</h1>
        </div>
        <div class="stage" id="stage5">
            <h2 class="climax-title">HAPPY BIRTHDAY.</h2>
            <p class="climax-subtitle">Make this year unforgettable.</p>
        </div>
        <div class="stage" id="stage6">
            <h2 class="final-settle">HAPPY BIRTHDAY, DAKSHA.</h2>
        </div>
        <!-- New Stage 7: The Signature -->
        <div class="stage" id="stage7">
            <p class="signature">Wishes, Ritu.</p>
        </div>
    </div>

    <script>
        const audioBtn = document.getElementById('audioBtn');
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let isPlaying = false;
        let oscillators = [];
        let gainNode;

        function startCinematicDrone() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (isPlaying) return;
            
            gainNode = audioCtx.createGain();
            gainNode.connect(audioCtx.destination);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 5);

            const frequencies = [43.65, 65.41, 87.31]; 
            frequencies.forEach(freq => {
                let osc = audioCtx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 200;

                osc.connect(filter);
                filter.connect(gainNode);
                osc.start();
                oscillators.push(osc);
            });
            isPlaying = true;
            audioBtn.innerText = "Sound [On]";
        }

        function stopCinematicDrone() {
            if (gainNode) {
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
                setTimeout(() => {
                    oscillators.forEach(osc => osc.stop());
                    oscillators = [];
                    isPlaying = false;
                }, 2000);
            }
            audioBtn.innerText = "Sound [Off]";
        }

        audioBtn.addEventListener('click', () => {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (isPlaying) stopCinematicDrone();
            else startCinematicDrone();
        });

        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let isClimax = false;
        let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            targetMouseX = (e.clientX - width / 2) * 0.05;
            targetMouseY = (e.clientY - height / 2) * 0.05;
        });

        class Particle {
            constructor(x, y, isBurst = false) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.baseSize = Math.random() * 1.5;
                this.size = this.baseSize;
                
                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 15 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.life = 1.0;
                    this.decay = Math.random() * 0.01 + 0.005;
                    this.color = `rgba(255, 245, 220, ${Math.random()})`; 
                } else {
                    this.vx = (Math.random() - 0.5) * 0.2;
                    this.vy = (Math.random() - 0.5) * 0.2;
                    this.life = Math.random();
                    this.decay = 0;
                    this.color = `rgba(255, 255, 255, ${Math.random() * 0.3})`;
                }
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.decay > 0) {
                    this.life -= this.decay;
                    this.vx *= 0.95; 
                    this.vy *= 0.95;
                } else {
                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }
            }
            draw() {
                if (this.life <= 0) return;
                ctx.globalAlpha = this.decay > 0 ? this.life : 1;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        for (let i = 0; i < 150; i++) particles.push(new Particle());

        function triggerClimaxBurst() {
            if (isClimax) return;
            isClimax = true;
            for (let i = 0; i < 400; i++) particles.push(new Particle(width / 2, height / 2, true));
            canvas.style.background = 'radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0) 50%)';
            setTimeout(() => { canvas.style.background = 'transparent'; }, 500);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            mouseX += (targetMouseX - mouseX) * 0.1;
            mouseY += (targetMouseY - mouseY) * 0.1;
            
            ctx.save();
            ctx.translate(mouseX, mouseY);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.decay > 0 && p.life <= 0) particles.splice(i, 1);
            }
            ctx.restore();
            requestAnimationFrame(animate);
        }
        animate();

        // Include the new 7th stage
        const stages = [
            document.getElementById('stage1'), document.getElementById('stage2'),
            document.getElementById('stage3'), document.getElementById('stage4'),
            document.getElementById('stage5'), document.getElementById('stage6'),
            document.getElementById('stage7')
        ];
        
        const lines = [
            document.getElementById('line1'), document.getElementById('line2'), document.getElementById('line3')
        ];
        
        const ambientGlow = document.getElementById('ambientGlow');
        const scrollInd = document.getElementById('scrollInd');

        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            ambientGlow.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        });

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop;
            const docHeight = Math.max(
                document.body.scrollHeight, document.documentElement.scrollHeight,
                document.body.offsetHeight, document.documentElement.offsetHeight,
                document.body.clientHeight, document.documentElement.clientHeight
            ) - window.innerHeight;
            
            const scrollPercent = scrollTop / docHeight;

            if (scrollPercent > 0.02) scrollInd.style.opacity = '0';

            stages.forEach(stage => stage.classList.remove('active', 'passed'));
            lines.forEach(line => {
                line.style.opacity = '0';
                line.style.transform = 'translateY(10px)';
            });

            // Timings adjusted to fit the 7 stages
            if (scrollPercent >= 0 && scrollPercent < 0.12) {
                stages[0].classList.add('active');
                document.getElementById('pointLight').style.transform = `scale(${1 + (scrollPercent * 50)})`;
            } else if (scrollPercent >= 0.12) stages[0].classList.add('passed');

            if (scrollPercent >= 0.15 && scrollPercent < 0.28) {
                stages[1].classList.add('active');
            } else if (scrollPercent >= 0.28) stages[1].classList.add('passed');

            if (scrollPercent >= 0.32 && scrollPercent < 0.50) {
                stages[2].classList.add('active');
                if (scrollPercent > 0.34) { lines[0].style.opacity = '1'; lines[0].style.transform = 'translateY(0)'; }
                if (scrollPercent > 0.38) { lines[1].style.opacity = '1'; lines[1].style.transform = 'translateY(0)'; }
                if (scrollPercent > 0.42) { lines[2].style.opacity = '1'; lines[2].style.transform = 'translateY(0)'; }
            } else if (scrollPercent >= 0.50) stages[2].classList.add('passed');

            if (scrollPercent >= 0.55 && scrollPercent < 0.72) {
                stages[3].classList.add('active');
                ambientGlow.style.opacity = '0.3'; 
            } else if (scrollPercent >= 0.72) stages[3].classList.add('passed');

            if (scrollPercent >= 0.75 && scrollPercent < 0.86) {
                stages[4].classList.add('active');
                ambientGlow.style.opacity = '0.8';
                ambientGlow.style.background = 'radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(0,0,0,0) 70%)';
                if (!isClimax) triggerClimaxBurst();
            } else if (scrollPercent >= 0.86) {
                stages[4].classList.add('passed');
                isClimax = false;
            }

            if (scrollPercent >= 0.88 && scrollPercent < 0.94) {
                stages[5].classList.add('active');
                ambientGlow.style.opacity = '0.1';
            } else if (scrollPercent >= 0.94) {
                stages[5].classList.add('passed');
            }

            // The New Final Stage
            if (scrollPercent >= 0.96) {
                stages[6].classList.add('active');
                ambientGlow.style.opacity = '0';
            }
        });
    </script>
</body>
</html>
