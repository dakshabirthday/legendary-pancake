<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13.08.2011</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@100;200;300&display=swap');

        :root {
            /* Palette from image_f85a36.png */
            --bg-color: #09060f; /* Ultra-deep purple-black for cinematic contrast */
            --pastel-yellow: #FBF3C8;
            --pastel-pink: #FCBFF9;
            --pastel-lavender: #D397FA;
            --pastel-purple: #8D52D9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--pastel-yellow);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        /* Expanded scroll track to accommodate 4 images */
        .scroll-container {
            height: 1400vh;
        }

        /* --- AESTHETIC OVERLAYS (Softened) --- */
        .film-grain {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 99;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 98;
            background: radial-gradient(circle at center, transparent 40%, rgba(9, 6, 15, 0.9) 100%);
        }

        /* --- LAYOUT --- */
        .viewport {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            opacity: 0.9;
            pointer-events: none;
        }

        /* Ethereal purple/pink background glow */
        .ambient-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55vw; height: 55vw;
            background: radial-gradient(circle, rgba(211, 151, 250, 0.04) 0%, rgba(9, 6, 15, 0) 70%);
            z-index: 2;
            opacity: 0;
            transition: opacity 2.5s ease, transform 0.1s ease-out;
        }

        /* --- STAGE ANIMATIONS --- */
        .stage {
            position: absolute;
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.5s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 3s cubic-bezier(0.25, 1, 0.5, 1), 
                        filter 1.5s ease;
            filter: blur(15px);
            will-change: opacity, transform, filter;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stage.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0px);
        }

        .stage.passed {
            opacity: 0;
            transform: scale(1.05);
            filter: blur(15px);
        }

        /* --- AESTHETIC IMAGES (Dreamy Grade) --- */
        .cinematic-image-wrapper {
            width: 90vw;
            max-width: 450px;
            aspect-ratio: 4/5;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(141, 82, 217, 0.15); /* Purple shadow */
            position: relative;
        }

        .cinematic-image-wrapper.landscape {
            aspect-ratio: 16/9;
            max-width: 600px;
        }

        .cinematic-image-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 50px rgba(9, 6, 15, 0.6);
            pointer-events: none;
            border: 1px solid rgba(252, 191, 249, 0.1); /* Faint pink border */
            border-radius: 8px;
        }

        .cinematic-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Soft, dreamy color grade */
            filter: saturate(85%) contrast(95%) brightness(0.8) sepia(15%) hue-rotate(290deg);
            transform: scale(1.15);
            transition: transform 6s cubic-bezier(0.1, 0.8, 0.3, 1), filter 3s ease;
        }

        .stage.active .cinematic-image-wrapper img {
            transform: scale(1);
            filter: saturate(110%) contrast(105%) brightness(1) sepia(0%) hue-rotate(0deg);
        }

        /* --- TYPOGRAPHY --- */
        .point-of-light {
            width: 2px; height: 2px;
            background-color: var(--pastel-yellow);
            border-radius: 50%;
            box-shadow: 0 0 25px 4px var(--pastel-pink);
            transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .date {
            font-size: 1.1rem;
            letter-spacing: 0.6em;
            color: var(--pastel-pink);
            font-weight: 200;
        }

        .sequence-line {
            font-size: 1.4rem;
            letter-spacing: 0.3em;
            color: var(--pastel-yellow);
            font-weight: 200;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(211, 151, 250, 0.3);
        }

        .name-reveal {
            font-family: 'Cinzel', serif;
            font-size: clamp(3rem, 10vw, 9rem);
            letter-spacing: 0.25em;
            font-weight: 500;
            color: var(--pastel-yellow);
            text-shadow: 0 0 50px rgba(252, 191, 249, 0.4);
        }

        .climax-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 7vw, 7rem);
            letter-spacing: 0.15em;
            color: #fff;
            text-shadow: 0 0 60px var(--pastel-lavender);
            margin-bottom: 20px;
        }

        .climax-subtitle {
            font-size: 0.8rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: var(--pastel-pink);
            font-weight: 200;
        }

        .final-settle {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.2rem, 3vw, 3rem);
            letter-spacing: 0.3em;
            color: var(--pastel-yellow);
            font-weight: 400;
            text-shadow: 0 0 30px rgba(211, 151, 250, 0.5);
        }

        .signature {
            font-size: 0.75rem;
            letter-spacing: 0.8em;
            text-transform: uppercase;
            color: var(--pastel-lavender);
            opacity: 0.6;
        }

        /* --- UI --- */
        .audio-toggle {
            position: fixed;
            top: 35px; right: 40px;
            z-index: 100;
            background: none;
            border: none;
            color: var(--pastel-purple);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            cursor: pointer;
            text-transform: uppercase;
            pointer-events: auto;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }
        .audio-toggle:hover { 
            color: var(--pastel-pink); 
            text-shadow: 0 0 10px var(--pastel-lavender);
        }

        .scroll-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.55rem;
            letter-spacing: 0.4em;
            color: var(--pastel-purple);
            text-transform: uppercase;
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease;
            animation: pulse 4s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="scroll-container"></div>
    
    <div class="film-grain"></div>
    <div class="vignette"></div>

    <button class="audio-toggle" id="audioBtn">Sound [Off]</button>
    <div class="scroll-indicator" id="scrollInd">Scroll slowly</div>
    
    <div class="ambient-glow" id="ambientGlow"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="viewport">
        
        <!-- STAGE 0: Light -->
        <div class="stage" id="stage-light">
            <div class="point-of-light" id="pointLight"></div>
        </div>

        <!-- STAGE 1: Date -->
        <div class="stage" id="stage-date">
            <p class="date">13.08.2011</p>
        </div>

        <!-- STAGE 2: IMAGE 1 -->
        <div class="stage" id="stage-img1">
            <div class="cinematic-image-wrapper">
                <img src="https://i.postimg.cc/75DRS0VC/s.jpg" alt="Memory 1">
            </div>
        </div>

        <!-- STAGE 3: Text 1 -->
        <div class="stage" id="stage-txt1">
            <p class="sequence-line">One day.</p>
        </div>

        <!-- STAGE 4: IMAGE 2 -->
        <div class="stage" id="stage-img2">
            <div class="cinematic-image-wrapper landscape">
                <img src="https://i.postimg.cc/G4rfvGQp/s-1.jpg" alt="Memory 2">
            </div>
        </div>

        <!-- STAGE 5: Text 2 -->
        <div class="stage" id="stage-txt2">
            <p class="sequence-line">One person.</p>
        </div>

        <!-- STAGE 6: IMAGE 3 -->
        <div class="stage" id="stage-img3">
            <div class="cinematic-image-wrapper">
                <img src="https://i.postimg.cc/Xr3P9d8B/s-3.jpg" alt="Memory 3">
            </div>
        </div>

        <!-- STAGE 7: Text 3 -->
        <div class="stage" id="stage-txt3">
            <p class="sequence-line">One reason to celebrate.</p>
        </div>

        <!-- STAGE 8: IMAGE 4 (NEW) -->
        <div class="stage" id="stage-img4">
            <div class="cinematic-image-wrapper landscape">
                <img src="https://i.postimg.cc/87DYLMHJ/s-4.jpg" alt="Memory 4">
            </div>
        </div>

        <!-- STAGE 9: Name -->
        <div class="stage" id="stage-name">
            <h1 class="name-reveal">DAKSHA</h1>
        </div>

        <!-- STAGE 10: Climax -->
        <div class="stage" id="stage-climax">
            <h2 class="climax-title">HAPPY BIRTHDAY.</h2>
            <p class="climax-subtitle">Make this year unforgettable.</p>
        </div>

        <!-- STAGE 11: Settle -->
        <div class="stage" id="stage-settle">
            <h2 class="final-settle">HAPPY BIRTHDAY, DAKSHA.</h2>
        </div>

        <!-- STAGE 12: Signature -->
        <div class="stage" id="stage-sig">
            <p class="signature">Wishes, Ritu.</p>
        </div>
    </div>

    <script>
        // --- 1. AUDIO ---
        const audioBtn = document.getElementById('audioBtn');
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx, isPlaying = false, oscillators = [], gainNode;

        function toggleAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (isPlaying) {
                if (gainNode) gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
                setTimeout(() => {
                    oscillators.forEach(osc => osc.stop());
                    oscillators = [];
                    isPlaying = false;
                }, 2000);
                audioBtn.innerText = "Sound [Off]";
            } else {
                gainNode = audioCtx.createGain();
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 5);

                const frequencies = [43.65, 65.41, 87.31]; // Deep cinematic chord
                frequencies.forEach(freq => {
                    let osc = audioCtx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    let filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 150;
                    osc.connect(filter);
                    filter.connect(gainNode);
                    osc.start();
                    oscillators.push(osc);
                });
                isPlaying = true;
                audioBtn.innerText = "Sound [On]";
            }
        }
        audioBtn.addEventListener('click', toggleAudio);

        // --- 2. PARTICLES (Using the new palette) ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [], isClimax = false;
        let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;

        const palette = [
            'rgba(251, 243, 200, 1)', // Yellow
            'rgba(252, 191, 249, 1)', // Pink
            'rgba(211, 151, 250, 1)', // Lavender
            'rgba(141, 82, 217, 1)'   // Purple
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            targetMouseX = (e.clientX - width / 2) * 0.03;
            targetMouseY = (e.clientY - height / 2) * 0.03;
        });

        class Particle {
            constructor(x, y, isBurst = false) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.size = Math.random() * 1.8;
                
                // Assign a random color from the aesthetic palette
                const baseColor = palette[Math.floor(Math.random() * palette.length)];
                
                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 14 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.life = 1.0;
                    this.decay = Math.random() * 0.008 + 0.004;
                    this.color = baseColor;
                } else {
                    this.vx = (Math.random() - 0.5) * 0.15;
                    this.vy = (Math.random() - 0.5) * 0.15;
                    this.life = Math.random();
                    this.decay = 0;
                    this.color = baseColor.replace('1)', `${Math.random() * 0.3})`); // Add transparency
                }
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.decay > 0) {
                    this.life -= this.decay;
                    this.vx *= 0.96; this.vy *= 0.96;
                } else {
                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }
            }
            draw() {
                if (this.life <= 0) return;
                ctx.globalAlpha = this.decay > 0 ? this.life : 1;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        for (let i = 0; i < 150; i++) particles.push(new Particle());

        function triggerClimaxBurst() {
            if (isClimax) return;
            isClimax = true;
            for (let i = 0; i < 500; i++) particles.push(new Particle(width / 2, height / 2, true));
            // A soft lavender flash instead of white
            canvas.style.background = 'radial-gradient(circle, rgba(211,151,250,0.15) 0%, rgba(9,6,15,0) 70%)';
            setTimeout(() => { canvas.style.background = 'transparent'; }, 900);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            mouseX += (targetMouseX - mouseX) * 0.1;
            mouseY += (targetMouseY - mouseY) * 0.1;
            ctx.save();
            ctx.translate(mouseX, mouseY);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update(); p.draw();
                if (p.decay > 0 && p.life <= 0) particles.splice(i, 1);
            }
            ctx.restore();
            requestAnimationFrame(animate);
        }
        animate();

        // --- 3. TIMELINE ENGINE (Updated for 4 images) ---
        const timeline = [
            { id: 'stage-light', start: 0.00, end: 0.05 },
            { id: 'stage-date',  start: 0.06, end: 0.11 },
            { id: 'stage-img1',  start: 0.13, end: 0.20 },
            { id: 'stage-txt1',  start: 0.22, end: 0.27 },
            { id: 'stage-img2',  start: 0.29, end: 0.36 },
            { id: 'stage-txt2',  start: 0.38, end: 0.43 },
            { id: 'stage-img3',  start: 0.45, end: 0.52 },
            { id: 'stage-txt3',  start: 0.54, end: 0.59 },
            { id: 'stage-img4',  start: 0.61, end: 0.68 }, // The 4th image
            { id: 'stage-name',  start: 0.70, end: 0.76 },
            { id: 'stage-climax',start: 0.78, end: 0.88, isClimax: true },
            { id: 'stage-settle',start: 0.90, end: 0.95 },
            { id: 'stage-sig',   start: 0.97, end: 1.00 }
        ];

        const ambientGlow = document.getElementById('ambientGlow');
        const scrollInd = document.getElementById('scrollInd');

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = scrollTop / docHeight;

            if (scrollPercent > 0.01) scrollInd.style.opacity = '0';

            timeline.forEach(stage => {
                const el = document.getElementById(stage.id);
                if (!el) return;

                if (scrollPercent >= stage.start && scrollPercent < stage.end) {
                    el.classList.add('active');
                    el.classList.remove('passed');

                    if (stage.id === 'stage-light') {
                        document.getElementById('pointLight').style.transform = `scale(${1 + (scrollPercent * 60)})`;
                    }
                    if (stage.id === 'stage-name') {
                        ambientGlow.style.opacity = '0.3';
                        ambientGlow.style.background = 'radial-gradient(circle, rgba(252, 191, 249, 0.05) 0%, rgba(9, 6, 15, 0) 70%)';
                    }
                    if (stage.isClimax) {
                        ambientGlow.style.opacity = '0.7';
                        // Explosive pastel glow
                        ambientGlow.style.background = 'radial-gradient(circle, rgba(211, 151, 250, 0.15) 0%, rgba(9, 6, 15, 0) 70%)';
                        if (!isClimax) triggerClimaxBurst();
                    }
                } else if (scrollPercent >= stage.end) {
                    el.classList.remove('active');
                    el.classList.add('passed');
                    if (stage.isClimax) isClimax = false;
                } else {
                    el.classList.remove('active', 'passed');
                }
            });
            
            if (scrollPercent >= 0.90) ambientGlow.style.opacity = '0.1';
            if (scrollPercent >= 0.97) ambientGlow.style.opacity = '0';
        });
    </script>
</body>
</html>
